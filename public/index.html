<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Value.card - Find Collectibles Below Market Price</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <h1>💎 Value.card</h1>
        <p>Find collectibles priced below market value</p>
      </div>
    </header>

    <!-- Search Bar -->
    <div class="search-section">
      <input 
        type="text" 
        id="searchInput" 
        class="search-bar" 
        placeholder="Search for collectibles... (e.g., 'Pokemon card', 'Rare coin')"
      >
      <button id="searchBtn" class="search-btn">Search</button>
    </div>

    <!-- Category Menu -->
    <div class="category-section">
      <h3>Popular Categories</h3>
      <div class="category-menu">
        <button class="category-btn" data-category="coins">
          🪙 Coins
        </button>
        <button class="category-btn" data-category="cards">
          🎴 Trading Cards
        </button>
        <button class="category-btn" data-category="action-figures">
          🦸 Action Figures
        </button>
        <button class="category-btn" data-category="memorabilia">
          ⭐ Memorabilia
        </button>
        <button class="category-btn" data-category="vintage">
          🕰️ Vintage Items
        </button>
        <button class="category-btn" data-category="comics">
          📚 Comics
        </button>
        <button class="category-btn" data-category="stamps">
          📮 Stamps
        </button>
        <button class="category-btn" data-category="sports">
          ⚽ Sports Memorabilia
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-section">
      <label>
        Max Price: $
        <input type="number" id="maxPrice" min="0" placeholder="1000" value="1000">
      </label>
      <label>
        Discount (%): 
        <input type="number" id="discountThreshold" min="0" max="100" placeholder="20" value="20">
      </label>
      <button id="applyFilters" class="filter-btn">Apply Filters</button>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingSpinner" class="loading hidden">
      <div class="spinner"></div>
      <p>Scanning the web for deals...</p>
    </div>

    <!-- Results Section -->
    <div class="results-section">
      <h2>Deals Found</h2>
      <div id="results" class="results-grid">
        <!-- Results will be populated here -->
      </div>
      <p id="noResults" class="no-results hidden">No deals found. Try adjusting your filters or search term.</p>
    </div>
  </div>

  <footer>
    <p>Value.card © 2026 | Web scraper for collectible deals</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
